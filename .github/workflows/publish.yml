name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-1.0.0 to release the immutable Maven version
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirmation == 'publish-1.0.0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.0.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Import and verify release signing key
        shell: bash
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/nbmecalc-release-key.asc"
          printf '%s\n' "$MAVEN_GPG_PRIVATE_KEY" > "$key_file"
          grep -q '^-----BEGIN PGP PRIVATE KEY BLOCK-----$' "$key_file"
          grep -q '^-----END PGP PRIVATE KEY BLOCK-----$' "$key_file"
          # GitHub's multiline-secret normalization can remove the optional
          # blank armor-header separator. GnuPG still imports the complete
          # key but returns 2 for that warning, so the fingerprint below is
          # the authoritative success check.
          gpg --batch --import "$key_file" || true
          rm -f "$key_file"
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "5364CE815425A4564EF538120844F858E75D0853"
      - name: Verify immutable release metadata
        shell: bash
        run: |
          test "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" = "1.0.0"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 v1.0.0)"
      - name: Test, sign, and publish
        run: mvn --batch-mode --no-transfer-progress clean deploy -Prelease -Dgpg.pinentry-mode=loopback -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
